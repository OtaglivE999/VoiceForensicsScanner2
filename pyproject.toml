[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-forensics-scanner"
version = "1.0.0"
description = "Real-time voice detection and speaker identification system with far-field audio support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Voice Forensics Team"}
]
keywords = [
    "voice-detection",
    "speaker-identification",
    "audio-forensics",
    "speaker-recognition",
    "voice-activity-detection",
    "far-field-audio"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "webrtcvad>=2.0.10",
    "resemblyzer>=0.1.3",
    "noisereduce>=2.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20230918"]
dashboard = ["flask>=2.3.0", "flask-cors>=4.0.0"]
npu = ["onnxruntime>=1.16.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
all = [
    "openai-whisper>=20230918",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "onnxruntime>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/VoiceForensicsScanner"
Documentation = "https://github.com/yourusername/VoiceForensicsScanner#readme"
Repository = "https://github.com/yourusername/VoiceForensicsScanner.git"
Issues = "https://github.com/yourusername/VoiceForensicsScanner/issues"

[project.scripts]
voice-scanner = "src.soft_voice_scanner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
